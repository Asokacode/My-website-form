<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Papan Skor Pickleball Ganda</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; }
  .serve-dot {
    width: 10px; height: 10px; border-radius: 9999px;
    background: #fde047;
    box-shadow: 0 0 0 4px rgba(253,224,71,0.25);
  }
  .score-num { font-variant-numeric: tabular-nums; }
  input[type="text"]:focus { outline: none; }
</style>
</head>
<body class="bg-emerald-50 min-h-screen text-slate-800">

  <div class="max-w-3xl mx-auto px-4 py-6 sm:py-10">

    <!-- Header -->
    <div class="text-center mb-6">
      <p class="text-xs tracking-widest uppercase text-emerald-600 font-semibold">Ganda / Doubles</p>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-emerald-900">🏓 Papan Skor Pickleball</h1>
    </div>

    <!-- Input nama pemain -->
    <div class="bg-white rounded-2xl shadow-sm border border-emerald-100 p-4 sm:p-5 mb-5">
      <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wide mb-3">Nama Pemain</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-emerald-700 mb-1">Tim 1</label>
          <input id="playerA" type="text" value="Player A" class="w-full mb-2 px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-400 text-sm" />
          <input id="playerB" type="text" value="Player B" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-emerald-400 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-orange-600 mb-1">Tim 2</label>
          <input id="playerC" type="text" value="Player C" class="w-full mb-2 px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-orange-400 text-sm" />
          <input id="playerD" type="text" value="Player D" class="w-full px-3 py-2 rounded-lg border border-slate-200 bg-slate-50 focus:bg-white focus:ring-2 focus:ring-orange-400 text-sm" />
        </div>
      </div>
    </div>

    <!-- Papan skor -->
    <div class="grid grid-cols-2 gap-3 sm:gap-4 mb-5">

      <!-- Tim 1 -->
      <div id="cardTeam1" class="rounded-2xl p-4 sm:p-5 text-center shadow-sm border-2 transition-colors bg-emerald-600 border-emerald-700 text-white">
        <p id="labelTeam1" class="font-bold text-sm sm:text-base mb-1 truncate">Player A / Player B</p>
        <div id="serveBadge1" class="flex items-center justify-center gap-1.5 h-5 mb-2 text-[11px] font-mono tracking-wider text-yellow-200">
          <span class="serve-dot"></span> SERVIS · #<span id="serverNumLabel1">2</span>
        </div>
        <div id="scoreTeam1" class="score-num text-5xl sm:text-6xl font-black mb-3">0</div>
        <div class="flex gap-2 justify-center">
          <button onclick="changeScore('team1', -1)" class="w-11 h-11 rounded-xl bg-emerald-800/60 hover:bg-emerald-800 active:scale-95 transition font-bold text-lg">−</button>
          <button onclick="changeScore('team1', 1)" class="w-11 h-11 rounded-xl bg-white text-emerald-700 hover:bg-emerald-50 active:scale-95 transition font-bold text-lg shadow">+</button>
        </div>
      </div>

      <!-- Tim 2 -->
      <div id="cardTeam2" class="rounded-2xl p-4 sm:p-5 text-center shadow-sm border-2 transition-colors bg-slate-100 border-slate-200 text-slate-700">
        <p id="labelTeam2" class="font-bold text-sm sm:text-base mb-1 truncate">Player C / Player D</p>
        <div id="serveBadge2" class="flex items-center justify-center gap-1.5 h-5 mb-2 text-[11px] font-mono tracking-wider text-orange-500 opacity-0">
          <span class="serve-dot"></span> SERVIS · #<span id="serverNumLabel2">2</span>
        </div>
        <div id="scoreTeam2" class="score-num text-5xl sm:text-6xl font-black mb-3">0</div>
        <div class="flex gap-2 justify-center">
          <button onclick="changeScore('team2', -1)" class="w-11 h-11 rounded-xl bg-slate-300 hover:bg-slate-400 active:scale-95 transition font-bold text-lg">−</button>
          <button onclick="changeScore('team2', 1)" class="w-11 h-11 rounded-xl bg-orange-500 text-white hover:bg-orange-600 active:scale-95 transition font-bold text-lg shadow">+</button>
        </div>
      </div>
    </div>

    <!-- Status pertandingan -->
    <div id="statusLine" class="text-center text-sm font-mono text-emerald-700 mb-6 min-h-[20px]"></div>

    <!-- Kontrol -->
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button onclick="resetGame()" class="px-5 py-3 rounded-xl border-2 border-slate-300 text-slate-600 font-semibold text-sm hover:bg-slate-100 active:scale-95 transition">
        ⟳ Reset Pertandingan
      </button>
      <button onclick="downloadPDF()" class="px-5 py-3 rounded-xl bg-emerald-700 text-white font-semibold text-sm hover:bg-emerald-800 active:scale-95 transition shadow">
        ⬇ Download PDF
      </button>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">
      Skor menang: 11 poin, selisih minimal 2 · Server pertama tim mengikuti aturan resmi ganda pickleball
    </p>
  </div>

<script>
  // ---- STATE ----
  const WIN_SCORE = 11;
  const WIN_BY = 2;

  let state = {
    team1: { score: 0 },
    team2: { score: 0 },
    serving: 'team1',   // tim yang sedang servis
    serverNum: 2,        // di awal game, hanya 1 server (dihitung sebagai server #2)
    firstSequence: true  // penanda servis pertama dalam game (aturan sisi awal)
  };

  const el = {
    playerA: document.getElementById('playerA'),
    playerB: document.getElementById('playerB'),
    playerC: document.getElementById('playerC'),
    playerD: document.getElementById('playerD'),
    labelTeam1: document.getElementById('labelTeam1'),
    labelTeam2: document.getElementById('labelTeam2'),
    scoreTeam1: document.getElementById('scoreTeam1'),
    scoreTeam2: document.getElementById('scoreTeam2'),
    cardTeam1: document.getElementById('cardTeam1'),
    cardTeam2: document.getElementById('cardTeam2'),
    serveBadge1: document.getElementById('serveBadge1'),
    serveBadge2: document.getElementById('serveBadge2'),
    serverNumLabel1: document.getElementById('serverNumLabel1'),
    serverNumLabel2: document.getElementById('serverNumLabel2'),
    statusLine: document.getElementById('statusLine'),
  };

  function teamLabel(team) {
    if (team === 'team1') return `${el.playerA.value || 'Player A'} / ${el.playerB.value || 'Player B'}`;
    return `${el.playerC.value || 'Player C'} / ${el.playerD.value || 'Player D'}`;
  }

  function getWinner() {
    const a = state.team1.score, b = state.team2.score;
    const hi = Math.max(a, b);
    if (hi < WIN_SCORE) return null;
    if (Math.abs(a - b) < WIN_BY) return null;
    return a > b ? 'team1' : 'team2';
  }

  // Tombol +1 / -1. Klik "+1" pada tim yang SEDANG SERVIS = poin bertambah, servis tetap.
  // Klik "+1" pada tim yang TIDAK servis = terjadi "side out" (ganti servis) sesuai aturan ganda resmi.
  // Tombol "-1" hanya mengoreksi skor tanpa mengubah giliran servis.
  function changeScore(team, delta) {
    if (getWinner() && delta > 0) return; // game sudah selesai

    if (delta < 0) {
      state[team].score = Math.max(0, state[team].score - 1);
      render();
      return;
    }

    if (team === state.serving) {
      state[team].score += 1;
    } else {
      // side out
      if (state.firstSequence) {
        state.serving = team;
        state.serverNum = 1;
        state.firstSequence = false;
      } else if (state.serverNum === 1) {
        state.serverNum = 2;
      } else {
        state.serving = team;
        state.serverNum = 1;
      }
      state[team].score += 1;
    }
    render();
  }

  function resetGame() {
    if (!confirm('Reset skor pertandingan ke 0-0?')) return;
    state = { team1: { score: 0 }, team2: { score: 0 }, serving: 'team1', serverNum: 2, firstSequence: true };
    render();
  }

  function render() {
    el.labelTeam1.textContent = teamLabel('team1');
    el.labelTeam2.textContent = teamLabel('team2');
    el.scoreTeam1.textContent = state.team1.score;
    el.scoreTeam2.textContent = state.team2.score;

    const serving1 = state.serving === 'team1';
    el.serveBadge1.style.opacity = serving1 ? '1' : '0';
    el.serveBadge2.style.opacity = serving1 ? '0' : '1';
    el.serverNumLabel1.textContent = state.serverNum;
    el.serverNumLabel2.textContent = state.serverNum;

    // gaya kartu tim aktif servis
    if (serving1) {
      el.cardTeam1.className = 'rounded-2xl p-4 sm:p-5 text-center shadow-sm border-2 transition-colors bg-emerald-600 border-emerald-700 text-white';
      el.cardTeam2.className = 'rounded-2xl p-4 sm:p-5 text-center shadow-sm border-2 transition-colors bg-slate-100 border-slate-200 text-slate-700';
    } else {
      el.cardTeam1.className = 'rounded-2xl p-4 sm:p-5 text-center shadow-sm border-2 transition-colors bg-slate-100 border-slate-200 text-slate-700';
      el.cardTeam2.className = 'rounded-2xl p-4 sm:p-5 text-center shadow-sm border-2 transition-colors bg-orange-500 border-orange-600 text-white';
    }

    const winner = getWinner();
    if (winner) {
      el.statusLine.textContent = `🏆 ${teamLabel(winner)} MENANG!`;
    } else {
      const servingScore = state[state.serving].score;
      const otherTeam = state.serving === 'team1' ? 'team2' : 'team1';
      const receivingScore = state[otherTeam].score;
      const sisi = servingScore % 2 === 0 ? 'KANAN' : 'KIRI';
      el.statusLine.textContent = `SKOR: ${servingScore}-${receivingScore}-${state.serverNum}  ·  Servis dari sisi ${sisi}`;
    }
  }

  // ---- DOWNLOAD PDF ----
  function downloadPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4' });
    const marginX = 48;
    let y = 60;

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    doc.text('Rekap Pertandingan Pickleball Ganda', marginX, y);
    y += 26;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(11);
    doc.setTextColor(100);
    const tanggal = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    const jam = new Date().toLocaleTimeString('id-ID');
    doc.text(`Tanggal: ${tanggal}, ${jam}`, marginX, y);
    doc.setTextColor(0);
    y += 40;

    const winner = getWinner();

    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text('Hasil Akhir', marginX, y);
    y += 24;

    doc.setFontSize(12);
    [
      { key: 'team1', names: [el.playerA.value || 'Player A', el.playerB.value || 'Player B'] },
      { key: 'team2', names: [el.playerC.value || 'Player C', el.playerD.value || 'Player D'] },
    ].forEach(t => {
      doc.setFont('helvetica', 'bold');
      const winTag = winner === t.key ? '  (Pemenang)' : '';
      doc.text(`Tim (${t.names.join(' & ')})${winTag}`, marginX, y);
      doc.setFont('helvetica', 'normal');
      doc.text(`Skor akhir: ${state[t.key].score}`, marginX + 14, y + 16);
      y += 40;
    });

    y += 10;
    doc.setDrawColor(200);
    doc.line(marginX, y, doc.internal.pageSize.getWidth() - marginX, y);
    y += 24;

    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(120);
    doc.text('Dibuat otomatis dari Papan Skor Pickleball Ganda.', marginX, y);

    const nama1 = (el.playerA.value + '_' + el.playerB.value).replace(/[^a-z0-9]+/gi, '_');
    const nama2 = (el.playerC.value + '_' + el.playerD.value).replace(/[^a-z0-9]+/gi, '_');
    doc.save(`skor_pickleball_${nama1}_vs_${nama2}.pdf`);
  }

  // re-render label saat nama pemain diubah
  [el.playerA, el.playerB, el.playerC, el.playerD].forEach(inp => {
    inp.addEventListener('input', render);
  });

  render();
</script>
</body>
</html>
