<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Contact Form</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input, textarea {
      width: 100%; padding: 8px; margin-top: 5px;
      box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;
    }
    button {
      margin-top: 20px; padding: 10px 20px; background: #4285f4;
      color: white; border: none; border-radius: 4px; cursor: pointer;
    }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Contact Us</h2>
  <form id="myForm">
    <label>Name</label>
    <input type="text" name="name" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Message</label>
    <textarea name="message" rows="4" required></textarea>

    <button type="submit">Submit</button>
  </form>
  <p id="status"></p>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbxw-PMH_F8s2TX1jWBaNglgUUi4KqQiHScFJI2jngL6eRBDJoI0nmernutqGlayP-gpRQ/exec";
    const form = document.getElementById("myForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", (e) => {
      e.preventDefault();

      const data = {
        name: form.name.value,
        email: form.email.value,
        message: form.message.value
      };

      status.textContent = "Sending...";

      fetch(scriptURL, {
        method: "POST",
        body: JSON.stringify(data),
        headers: { "Content-Type": "application/json" }
      })
      .then(() => {
        status.textContent = "✅ Thanks! Your response was recorded.";
        form.reset();
      })
      .catch((error) => {
        status.textContent = "❌ Something went wrong.";
        console.error(error);
      });
    });
  </script>

</body>
</html>
